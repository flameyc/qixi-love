<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1026">
<title>倒着走回相遇那天 · 七夕</title>
<style>
:root{
  --bg:#0b1026;
  --bg2:#171032;
  --ink:#fdf3e3;
  --gold:#f3c98b;
  --rose:#ff9db0;
  --dim:#b9a98c;
  --line:rgba(243,201,139,.35);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
html,body{height:100%;overflow:hidden;}
body{
  background:var(--bg);color:var(--ink);overflow-x:hidden;
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.serif{font-family:"Songti SC","STSong","Noto Serif SC","SimSun",serif;}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;}

canvas{display:block;}
.scene-bg{position:absolute;inset:0;width:100%;height:100%;}
section{
  position:fixed;inset:0;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  will-change:opacity;
}
.section-card{position:relative;z-index:3;width:100%;}
.veil{position:absolute;inset:0;z-index:2;pointer-events:none;background:
  radial-gradient(120% 90% at 50% 20%, transparent 40%, rgba(5,8,25,.55) 100%);}

/* ---------- 门口：先写下你的名字 ---------- */
#gate{
  position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;
  text-align:center;overflow:hidden;
  transition:opacity 1.6s ease, visibility 1.6s;
}
#gate.done{opacity:0;visibility:hidden;pointer-events:none;}
.gate-inner{position:relative;z-index:3;padding:0 24px;max-width:640px;}
.gate-kicker{letter-spacing:.5em;color:var(--gold);font-size:clamp(12px,3vw,15px);opacity:.9;margin-bottom:20px;text-indent:.5em;}
.gate-title{font-size:clamp(30px,7vw,56px);font-weight:600;letter-spacing:.14em;margin-bottom:30px;
  background:linear-gradient(180deg,#fff6e6 20%, var(--gold) 82%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  text-shadow:0 0 60px rgba(243,201,139,.2);}
.gate-hint{color:var(--dim);letter-spacing:.25em;font-size:clamp(11px,2.6vw,13px);line-height:2;margin-bottom:34px;}
.gate-box{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
.gate-input{
  background:rgba(11,16,38,.55);border:1px solid var(--line);border-radius:999px;
  color:var(--ink);padding:14px 26px;font-size:16px;letter-spacing:.15em;text-align:center;width:min(280px,72vw);
  outline:none;caret-color:var(--gold);transition:border-color .3s, box-shadow .3s;font-family:inherit;
}
.gate-input:focus{border-color:var(--gold);box-shadow:0 0 24px rgba(243,201,139,.25);}
.gate-input::placeholder{color:rgba(185,169,140,.6);letter-spacing:.2em;}
.gate-swirl{animation:pop 1s .3s both;}
.gate-foot{position:absolute;bottom:24px;left:0;right:0;z-index:3;color:rgba(243,201,139,.45);font-size:12px;letter-spacing:.3em;text-align:center;}

/* ---------- 封面 ---------- */
#cover{justify-content:center;text-align:center;}
.cover-inner{position:relative;z-index:3;padding:0 24px 80px;}
.to-line{letter-spacing:.65em;color:var(--gold);font-size:clamp(13px,3vw,17px);text-indent:.65em;opacity:.9;}
.big-title{
  font-size:clamp(42px,10vw,100px);font-weight:600;margin:26px 10px 10px;letter-spacing:.08em;
  background:linear-gradient(180deg,#fff6e6 20%, var(--gold) 80%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  text-shadow:0 0 60px rgba(243,201,139,.25);
  animation:rise 1.6s .2s both;
}
.divider{margin:8px 0 18px;color:var(--gold);letter-spacing:1.1em;text-indent:1.1em;font-size:14px;opacity:.85;}
.sub-line{color:var(--dim);letter-spacing:.24em;font-size:clamp(11px,3vw,14px);line-height:2;margin-bottom:34px;white-space:pre-line;}
.cover-actions{display:flex;flex-direction:column;align-items:center;gap:14px;}
.btn{
  border:1px solid var(--line);padding:13px 38px;letter-spacing:.35em;text-indent:.35em;
  border-radius:999px;color:var(--gold);font-size:15px;position:relative;
  transition:transform .25s, box-shadow .3s, background .3s, color .3s;
}
.btn:hover{background:rgba(243,201,139,.12);box-shadow:0 0 30px rgba(243,201,139,.35);transform:translateY(-2px);}
.btn.solid{background:linear-gradient(120deg,var(--gold),#ffd9a0);color:#241a08;border-color:transparent;font-weight:600;}
.music-state{font-size:12px;color:var(--dim);letter-spacing:.2em;margin-top:-4px;opacity:0;transition:opacity .4s;}
.music-state.on{opacity:1;}
.scroll-hint{
  position:absolute;bottom:26px;left:50%;transform:translateX(-50%);z-index:4;
  color:var(--dim);font-size:12px;letter-spacing:.35em;text-align:center;
} .scroll-hint .chev{display:block;font-size:18px;margin-top:6px;animation:bob 1.6s infinite;}

/* ---------- 章节（倒叙） ---------- */
.chapter{color:var(--ink);}
.chapter-inner{position:relative;z-index:3;max-width:780px;padding:0 30px;}
.chap-no{letter-spacing:.6em;color:var(--gold);font-size:clamp(12px,2.6vw,14px);margin-bottom:14px;}
.rewind{display:inline-block;margin-bottom:18px;letter-spacing:.3em;font-size:clamp(11px,2.6vw,13px);color:#e8d9bd;
  border:1px solid var(--line);border-radius:999px;padding:7px 18px;opacity:.9;
  animation:pop .9s both;}
.chapter h2{font-size:clamp(38px,9vw,84px);font-weight:600;margin-bottom:22px;text-shadow:0 4px 30px rgba(0,0,0,.5);}
.chapter p{font-size:clamp(16px,4vw,21px);line-height:2;color:#f2e9d8;text-shadow:0 2px 14px rgba(0,0,0,.7);letter-spacing:.06em;}
.chapter-inner.left{align-self:flex-start;margin-left:max(24px,6vw);margin-top:14vh;}
.chapter .photo{background-size:cover;background-position:center;}
.chapter .photo-overlay{position:absolute;inset:0;z-index:2;background:linear-gradient(180deg,rgba(6,9,25,.25),rgba(6,9,25,.72));}

/* ---------- 信件 ---------- */
#letter{background:radial-gradient(120% 120% at 50% 0%, #241a3d 0%, var(--bg) 70%);}
.paper{
  position:relative;z-index:3;width:min(640px,88vw);background:linear-gradient(180deg,#fff9ee,#f6ead2);
  color:#4a3a20;border-radius:6px;padding:56px clamp(26px,6vw,64px);
  box-shadow:0 30px 90px rgba(0,0,0,.55);
}
.paper h3{font-size:clamp(20px,4.6vw,28px);letter-spacing:.2em;text-align:center;color:#8a6640;margin-bottom:30px;}
.letter-body{font-family:"Songti SC","STSong","SimSun",serif;font-size:clamp(16px,4vw,19px);line-height:2.1;letter-spacing:.05em;white-space:pre-wrap;min-height:120px;}
.caret{display:inline-block;width:2px;height:1em;background:#b2865a;vertical-align:-0.15em;margin-left:2px;animation:blink .8s steps(1) infinite;}
.seal{
  position:absolute;left:50%;top:-26px;transform:translateX(-50%);
  width:52px;height:52px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #e06a6a, #a83c46 70%);
  display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 6px 18px rgba(0,0,0,.4);
}
/* ---------- 解锁 ---------- */
#unlock{flex-direction:column;text-align:center;padding:0 24px;}
.unlock-prompt{position:relative;z-index:3;font-size:clamp(16px,4vw,21px);line-height:2;color:#f2e9d8;letter-spacing:.08em;max-width:560px;}
.unlock-tip{position:relative;z-index:3;color:var(--dim);font-size:13px;letter-spacing:.25em;margin-top:10px;}
.heart-wrap{position:relative;z-index:3;margin:40px auto 10px;width:150px;height:150px;}
.heart-wrap svg{width:100%;height:100%;}
.ring{transform:rotate(-90deg);}
.ring .track{fill:none;stroke:rgba(243,201,139,.18);stroke-width:2;}
.ring .bar{fill:none;stroke:var(--gold);stroke-width:2;stroke-linecap:round;transition:stroke-dashoffset .12s linear;}
.heart-core{cursor:pointer;filter:drop-shadow(0 0 18px rgba(255,157,176,.45));transition:transform .25s;}
.heart-core:active{transform:scale(.94);}
.unlock-state{position:relative;z-index:3;height:30px;margin-top:18px;font-size:14px;color:var(--gold);letter-spacing:.3em;}
/* ---------- 结尾（千纸鹤代笔） ---------- */
#final{flex-direction:column;text-align:center;padding:0 24px;min-height:100vh;}
#crane{position:absolute;inset:0;z-index:3;width:100%;height:100%;pointer-events:none;}
.final-line{
  position:relative;z-index:6;font-size:clamp(30px,8vw,64px);line-height:1.7;font-weight:600;letter-spacing:.12em;
  opacity:0;transform:translateY(30px);transition:opacity 1.6s,transform 1.6s;text-shadow:0 2px 30px rgba(0,0,0,.6);
}
#final.in .final-line{opacity:1;transform:none;}
.final-line b{color:var(--gold);text-shadow:0 0 40px rgba(243,201,139,.5);}
.signature{position:relative;z-index:6;margin-top:44px;color:var(--dim);letter-spacing:.4em;font-size:14px;text-indent:.4em;cursor:pointer;}
.replay{position:relative;z-index:6;margin-top:56px;}
.footer{position:absolute;bottom:18px;left:0;right:0;z-index:4;text-align:center;color:rgba(243,201,139,.45);font-size:12px;letter-spacing:.3em;}

/* ---------- 乐章进度与导航 ---------- */
#movement{
  position:fixed;left:18px;bottom:22px;z-index:60;pointer-events:none;
  color:rgba(243,201,139,.8);font-size:12px;letter-spacing:.28em;text-indent:.28em;
  border:1px solid var(--line);border-radius:999px;padding:8px 16px;
  opacity:0;transition:opacity 1s;background:rgba(11,16,38,.45);
}
#movement.on{opacity:1;}
#dots{position:fixed;right:18px;top:50%;transform:translateY(-50%);z-index:55;display:flex;flex-direction:column;gap:14px;}
#dots a{width:9px;height:9px;border-radius:50%;border:1px solid var(--gold);background:transparent;display:block;transition:all .3s;}
#dots a.on{background:var(--gold);box-shadow:0 0 12px var(--gold);transform:scale(1.3);}

/* ---------- 动效 ---------- */
@keyframes rise{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:none;}}
@keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(8px);}}
@keyframes blink{50%{opacity:0;}}
@keyframes pop{0%{transform:scale(.85);opacity:0;}100%{transform:scale(1);opacity:1;}}

@media (max-width:640px){ #dots{display:none;} .chapter-inner{margin-left:6vw;} }
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto;}
  *{animation-duration:.001s !important;animation-iteration-count:1 !important;transition-duration:.001s !important;}
}
</style>
</head>
<body>
<div id="movement"></div>
<nav id="dots" aria-hidden="true"></nav>

<!-- ========== 门口：先写下你的名字 ========== -->
<div id="gate">
  <canvas class="scene-bg" data-scene="gate" aria-hidden="true"></canvas>
  <div class="veil"></div>
  <div class="gate-inner">
    <div class="gate-kicker serif">这里有一封信，是为你写的</div>
    <h1 class="gate-title serif">请写下你的名字</h1>
    <p class="gate-hint">然后，你可以把这封信，<br>倒着读一遍。</p>
    <div class="gate-box">
      <input id="nameInput" class="gate-input" type="text" maxlength="12" autocomplete="off" placeholder="你的名字">
      <button id="openBtn" class="btn solid gate-swirl">拆开这封信 →</button>
    </div>
  </div>
  <div class="gate-foot">戴上耳机，会更好 · 之后用「空格 / 右键 / 滚动」翻页</div>
</div>

<!-- ========== 封面 ========== -->
<section id="cover">
  <canvas class="scene-bg" data-scene="cover"></canvas>
  <div class="veil"></div>
  <div class="cover-inner">
    <div class="to-line serif" id="toLine">TO · ★</div>
    <h1 class="big-title serif" id="mainTitle">倒着走回相遇那天</h1>
    <div class="divider serif">⟲ ✦ ⟲</div>
    <p class="sub-line" id="coverSub"></p>
    <div class="cover-actions">
      <button class="btn solid" id="startBtn" >然后 · 开始吧</button>
      <button class="btn" id="musicBtn">♫ 换首歌</button>
      <span class="music-state" id="musicState">♪ 音乐播放中 · 乐章随倒带切换</span>
    </div>
  </div>
  <div class="scroll-hint"><span>空格 / 右键 / 滚动 —— 翻开下一页</span><span class="chev">⌄</span></div>
</section>

<!-- ========== 章节（由 JS 渲染，倒序：现在 → 相遇） ========== -->
<main id="chapters"></main>

<!-- ========== 信件 ========== -->
<section id="letter">
  <canvas class="scene-bg" data-scene="letter" aria-hidden="true"></canvas>
  <div class="veil"></div>
  <div class="paper">
    <div class="seal">♥</div>
    <h3 class="serif" id="letterTitle"></h3>
    <div class="letter-body" id="letterBody"></div>
  </div>
</section>

<!-- ========== 解锁 ========== -->
<section id="unlock">
  <canvas class="scene-bg" data-scene="unlock" aria-hidden="true"></canvas>
  <div class="veil"></div>
  <p class="unlock-prompt" id="unlockPrompt"></p>
  <div class="unlock-tip" id="unlockTip"></div>
  <div class="heart-wrap">
    <svg viewBox="0 0 120 120" aria-hidden="true">
      <defs>
        <linearGradient id="fillGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffb6c4"/><stop offset="1" stop-color="#ff5f7e"/>
        </linearGradient>
        <clipPath id="fillClip"><rect id="clipRect" x="0" y="120" width="120" height="120"/></clipPath>
      </defs>
      <circle class="ring track" cx="60" cy="60" r="57"/>
      <circle class="ring bar" id="ringBar" cx="60" cy="60" r="57"/>
      <g class="heart-core" id="heartCore">
        <path d="M60 94 C34 76 16 60 16 40 C16 26 27 16 40 16 C48 16 57 21 60 29 C63 21 72 16 80 16 C93 16 104 26 104 40 C104 60 86 76 60 94 Z"
              fill="rgba(20,12,20,.35)" stroke="#ff8fa3" stroke-width="2"/>
        <path clip-path="url(#fillClip)" d="M60 94 C34 76 16 60 16 40 C16 26 27 16 40 16 C48 16 57 21 60 29 C63 21 72 16 80 16 C93 16 104 26 104 40 C104 60 86 76 60 94 Z"
              fill="url(#fillGrad)"/>
      </g>
    </svg>
  </div>
  <div class="unlock-state" id="unlockState"></div>
</section>

<!-- ========== 结尾（千纸鹤代笔） ========== -->
<section id="final">
  <canvas class="scene-bg" data-scene="final" aria-hidden="true"></canvas>
  <div class="veil"></div>
  <canvas id="crane" aria-hidden="true"></canvas>
  <h2 class="final-line serif" id="finalTitle"></h2>
  <p class="final-line serif" style="transition-delay:1.2s" id="finalLine"></p>
  <div class="signature serif" id="signature"></div>
  <div class="replay"><button class="btn" id="replayBtn">再倒放一遍 ↺</button></div>
  <div class="footer">写给 {name} · 从相遇那天起</div>
</section>

<script>
window.__errs = window.__errs || [];
window.addEventListener("error", function(e){ window.__errs.push("err:" + e.message + " @" + (e.filename||"") ); });
window.addEventListener("unhandledrejection", function(e){ window.__errs.push("rej:" + e.reason); });
/* =====================================================================
   可配置数据 —— 复制替换这里即可，无需动下方代码
   · 门口提问：gate.ask=true 时，访客必须先输入自己的名字才能拆开。
     gate.ask=false 并填上 toName，则会跳过门口，直接以 toName 收信。
   · 文案里写 {name} 的位置，会自动替换成访客输入的名字（或 toName）。
   · 真照片：同目录建 assets/ 文件夹，在章节里加 photo: "assets/相遇.jpg"
   · 背景音乐：内置三乐章生成钢琴，随倒带自动切换（无需文件）
   ===================================================================== */
const DATA = {
  gate: { ask: true, button: "拆开这封信 →" },
  toName: "",                       // 留空 = 让 TA 在门口写自己的名字；填写则跳过
  coverSub: "戴上耳机，慢慢往上滑。\n这一页的每个字，都会轻轻念出你的名字。",
  chapters: [
    { n:"01", title:"现在", scene:"city", daysAgo:0,
      text:["先停在这里，别急着往下。","{name}，我想把一切都倒着放给你看——","从此刻，一直退回到最开始心动的那个瞬间。"] },
    { n:"02", title:"日常", scene:"blossom", daysAgo:365,
      text:["退回到最近的一年。","说不完的话、逛不完的街、一起吃的每一顿饭，","这些被叫做「日常」的事，其实一直在发光。"] },
    { n:"03", title:"在一起", scene:"sunset", daysAgo:730,
      text:["再往回，是决定牵起你手的那天。","晚霞烧红了整片天，","我听见自己心里在说：是这个人了。"] },
    { n:"04", title:"心动", scene:"starry", daysAgo:1100,
      text:["继续倒带，快到藏不住的那一段。","某个普通的晚上，你回头笑了一下，","整片星空，忽然有了主人。"] },
    { n:"05", title:"相遇", scene:"sea", daysAgo:1460,
      text:["最后，停在这里——我们第一次相见的那晚。","故事是从这里开始的，","而我喜欢你，从那一刻就没有停过。"] }
  ],
  letter: { title:"倒带到这里，有些话该说给你听", body:[
    "{name}，写这封信的时候，我把那些日子又走了一遍。",
    "好的坏的，笑过的闹过的，",
    "被时间冲淡的都是小事，",
    "留下来的，全是你。",
    "谢谢你，愿意来和我相遇。"
  ]},
  unlock: { prompt:"要到最想说的那一句了。\n它只准备说给 {name} 一个人听。", tip:"请长按下面的红心 · 把它填满（约 3 秒）", holdSeconds:3 },
  final: { title:"所以，{name}，我想对你说——", line:"我喜欢你。不是今天才喜欢，<br>是<b>一直</b>都喜欢。", signature:"—— 永远倒着爱你的我 · 七夕" },
  craneLine: "从相遇那天起，就没有停下过喜欢。"   // 千纸鹤飞过时用尾迹写下的字
};

/* ==================== 以下为代码，一般不用动 ==================== */
(function(){
  "use strict";
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let opened=false, cur=0, busy=false;   // 翻页状态：opened=已拆信可翻页；busy=2 秒渐变中（输入锁定）

  /* ---------- 工具 ---------- */
  const $ = (s, p) => (p||document).querySelector(s);
  const lerp = (a,b,t)=>a+(b-a)*t;
  const rand=(a,b)=>a+Math.random()*(b-a);
  const TAU=Math.PI*2;
  const fill = s => String(s).split("{name}").join(NAME);

  /* ---------- 名称：从门口或配置来 ---------- */
  let NAME = (DATA.gate.ask && !DATA.toName) ? "" : (DATA.toName||"你");

  /* 元音：乐章名称（随滚动切换） */
  const ZONES = {
    now:  "笃定",
    move: "心动",
    soft: "温柔"
  };

  /* =====================================================================
     门口：先写下名字，才能拆开信
     ===================================================================== */
  const gateEl=$("#gate"), nameInput=$("#nameInput"), openBtn=$("#openBtn");
  function unlockTheLetter(){
    if(gateEl._done) return; gateEl._done=true;
    NAME = (nameInput.value||"").trim() || "你";
    gateEl.classList.add("done");
    const gcv=document.querySelector("#gate canvas.scene-bg");
    if(gcv&&gcv._scene) gcv._scene.setActive(false);   // 门口打开后停下其背景
    setTimeout(()=>{ if(gateEl.parentNode) gateEl.style.display="none"; }, 1800);
    applyName();                 // 把名字写进所有文案
    if(!music.on) toggleMusic(); // 点击拆信 = 手势，正好起乐
    $("#movement").classList.add("on");
    opened=true; paint(0);       // 可以开始翻页了
  }
  const useName = (DATA.gate.ask && !DATA.toName);
  if(useName){
    document.body.style.overflow="hidden";   // 门口未拆开前，锁住滚动
    openBtn.addEventListener("click", unlockTheLetter);
    nameInput.addEventListener("keydown", e=>{ if(e.key==="Enter") unlockTheLetter(); });
  } else {
    // 配置了固定名字 → 直接打开，跳过门口
    gateEl.style.display="none";
    applyName();
  }

  /* ---------- 把 {name} 写进 DOM ---------- */
  function applyName(){
    $("#toLine").textContent="TO · "+NAME;
    $("#coverSub").textContent=DATA.coverSub;
    document.querySelectorAll(".chapter p").forEach(p=>{ p.textContent=fill(p.textContent); });
    document.querySelectorAll(".chapter .rewind").forEach(el=>{ el.textContent=fill(el.textContent); });
    $("#unlockPrompt").textContent=fill(DATA.unlock.prompt);
    $("#finalTitle").innerHTML=fill(DATA.final.title);
    $("#finalLine").innerHTML=fill(DATA.final.line);
    $("#signature").textContent=fill(DATA.final.signature);
    $(".footer").textContent=fill($(".footer").textContent);
  }

  /* ---------- 渲染章节（倒序：现在→相遇） ---------- */
  (function renderChapters(){
    const host=$("#chapters");
    DATA.chapters.forEach(ch=>{
      const sec=document.createElement("section");
      sec.className="chapter"; sec.id="ch-"+ch.n;
      if(ch.photo){

  /* ---------- 音乐：三乐章生成钢琴（随倒带切换） ---------- */
  const music={on:false, ctx:null, timer:null, next:0, step:0, zone:"now"};
  const CHORDS={
    now:  [[60,64,67,71],[57,60,64,67],[53,57,60,64],[55,59,62,67]],   // 笃定 · C 大调温暖
    move: [[57,61,64,68],[54,58,61,65],[52,56,59,63],[59,62,66,69]],   // 心动 · 明亮上浮
    soft: [[57,60,64,67],[53,57,60,64],[55,59,62,67],[52,56,59,63]]    // 温柔 · 更轻更慢
  };
  function setZone(z){
    if(!music.on || !CHORDS[z] || music.zone===z) return;
    music.zone=z;
    const el=$("#movement");
    el.textContent="乐章 · "+ZONES[z]+" ⟲";
    // 换乐章时，轻轻地亮一下
    if(!reduce){ el.style.boxShadow="0 0 22px rgba(243,201,139,.5)"; setTimeout(()=>{ el.style.boxShadow=""; },700); }
  }
  function note(freq,t,dur,vol,type="triangle"){
    const ctx=music.ctx;
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol,t+.02);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t+dur+.05);
  }
  function mid2f(m){ return 440*Math.pow(2,(m-69)/12); }
  function schedule(){
    const ctx=music.ctx, chordSet=CHORDS[music.zone]||CHORDS.now;
    const soft=music.zone==="soft";
    while(music.next<ctx.currentTime+.6){
      const chord=chordSet[music.step%chordSet.length];
      const t=music.next, sp=soft? .42 : .36;
      chord.forEach((m,i)=>{ note(mid2f(m-12), t+i*sp, soft?1.8:1.6, soft?.045:.05); if(i%2===0) note(mid2f(m), t+i*sp, soft?2.2:1.9, soft?.038:.045,"sine"); });
      note(mid2f(chord[0]-24), t, soft?3.8:3.4, .05, "sine");
      music.next += 4*sp + .05;
      music.step++;
    }
  }
  function toggleMusic(){
    if(!music.on){
      music.ctx=new (window.AudioContext||window.webkitAudioContext)();
      if(music.ctx.state==="suspended") music.ctx.resume();
      music.next=music.ctx.currentTime+.1; music.step=0;
      music.timer=setInterval(schedule,120);
      music.on=true;
      $("#musicBtn").textContent="♫ 换首歌";
      $("#musicState").classList.add("on");
      $("#movement").classList.add("on");
      setZone("now");
    } else {
      clearInterval(music.timer); music.timer=null;
      if(music.ctx){ music.ctx.close(); music.ctx=null; }
      music.on=false;
      $("#musicBtn").textContent="♫ 打开音乐";
      $("#musicState").classList.remove("on");
      $("#movement").classList.remove("on");
    }
  }
  $("#musicBtn").addEventListener("click", toggleMusic);

  /* ---------- 翻页：开始按钮（拆信后点「开始」＝翻到第 2 页） ---------- */

  /* ---------- 千纸鹤代笔（结尾） ---------- */
  let craneStarted=false;
  function startCrane(){
    if(craneStarted) return; craneStarted=true;
    if(reduce){ $("#final").classList.add("in"); return; }
    if(!DATA.craneLine) { $("#final").classList.add("in"); return; }
    const cv=$("#crane"), c=cv.getContext("2d");
    const size=()=>{ cv.width=cv.offsetWidth*devicePixelRatio; cv.height=cv.offsetHeight*devicePixelRatio; };
    size(); window.addEventListener("resize", size);
    const W=cv.width,H=cv.height,d=Math.min(devicePixelRatio||1,2);
    const text=DATA.craneLine, N=text.length;
    const fs=Math.max(30, Math.min(54, W/N*1.05))*d;        // 按宽度自适应字号
    c.font="600 "+fs+"px \"Songti SC\",STSong,serif";
    const charW=c.measureText(text).width/N;
    const x0=(W - charW*N)/2, yLine=H*.74;
    const trail=[]; let p=0; let raf=0;
    // 千纸鹤的飞行路径（分段：入场→飞到书写线上→沿书写线飞过）
    function pos(t){
      if(t<.2){ const k=t/.2; const x=lerp(-60*d, x0-charW*1.5, k); const y=lerp(H*.88, yLine-120*d, Math.sin(k*Math.PI/2)); return {x,y,ang:lerp(.3,-.35,k)}; }
      const k=(t-.2)/.8; const x=x0-charW*2+k*(charW*(N+4)); const y=yLine+Math.sin(k*9)*8*d+6*d; return {x,y,ang:-.12+Math.sin(k*9)*.1};
    }
    function step(now){
      p+=1/60; if(p>1) p=1;
      const P=pos(p); trail.push({x:P.x,y:P.y,a:1});
      if(trail.length>70) trail.shift();
      c.clearRect(0,0,W,H);
      // 已写出的字（千纸鹤飞过的地方，字迹留在后面）
      const written=(p-.2)/.8; // 0..1（前 20% 只是飞近）
      const n=Math.max(0,Math.floor(Math.max(0,written)*(N+2)));
      if(n>0){
        for(let i=0;i<n && i<N;i++){
          const cx=x0+charW*i, alpha=1-(n-1-i)*.0;   // 全部保留
          c.save(); c.globalCompositeOperation="lighter";
          c.shadowColor="rgba(243,201,139,.9)"; c.shadowBlur=14*d;
          c.fillStyle="rgba(255,238,205,"+(.92)+")"; c.font="600 "+fs+"px \"Songti SC\",STSong,serif";
          c.fillText(text[i], cx, yLine+(fs*.12));
          c.restore();
        }
      }
      // 尾迹星光
      c.save(); c.globalCompositeOperation="lighter";
      trail.forEach((t2,i2)=>{
        c.fillStyle="rgba(255,224,180,"+(t2.a*.05)+")";
        c.beginPath(); c.arc(t2.x,t2.y,3*d*i2/trail.length+1,0,TAU); c.fill();
        t2.a*=.95;
      });
      c.restore();
      // 千纸鹤本体
      drawCrane(c,P.x,P.y,P.ang,1.15*d);
      // 落定
      if(p>=1){
        c.save(); c.globalCompositeOperation="lighter";
        const gr=c.createRadialGradient(P.x,P.y,0,P.x,P.y,70*d);
        gr.addColorStop(0,"rgba(255,228,190,.5)"); gr.addColorStop(1,"rgba(255,228,190,0)");
        c.fillStyle=gr; c.beginPath(); c.arc(P.x,P.y,70*d,0,TAU); c.fill(); c.restore();
        cancelAnimationFrame(raf);
        setTimeout(()=>{ $("#final").classList.add("in"); }, 500);
        return;
      }
      raf=requestAnimationFrame(step);
    }
    raf=requestAnimationFrame(step);
  }
  /* 简笔千纸鹤（纸鹤形状剪影） */
  function drawCrane(c,x,y,ang,s){
    c.save(); c.translate(x,y); c.rotate(ang); c.scale(s,s);
    c.fillStyle="rgba(255,245,225,.96)";
    // 身体（细长菱形）
    c.beginPath(); c.moveTo(2,-3); c.lineTo(14,0); c.lineTo(2,3); c.lineTo(-8,0); c.closePath(); c.fill();
    // 后翼
    c.beginPath(); c.moveTo(3,-1); c.lineTo(-4,-13); c.lineTo(-2,-1); c.closePath(); c.fill();
    // 前翼
    c.beginPath(); c.moveTo(3,1); c.lineTo(-4,13); c.lineTo(-2,1); c.closePath(); c.fill();
    // 颈 + 头
    c.fillStyle="rgba(255,245,225,.96)";
    c.beginPath(); c.moveTo(13,-1); c.lineTo(18,-4); c.lineTo(19,-2); c.lineTo(14,1); c.closePath(); c.fill();
    c.restore();
  }

  /* ---------- Canvas 场景（粒子引擎） ---------- */
  const canvases=[];
  const pointer={x:0,y:0};
  if(!reduce){
    addEventListener("pointermove",(e)=>{
      pointer.x=(e.clientX/innerWidth)-.5;
      pointer.y=(e.clientY/innerHeight)-.5;
    },{passive:true});
  }
  class Scene{
    constructor(canvas,type){
      this.cv=canvas; this.type=type; this.t=0;
      this.run=false; this.raf=0;
      this.dpr=Math.min(devicePixelRatio||1,1.6);
      canvas.width = canvas.offsetWidth*this.dpr;
      canvas.height = canvas.offsetHeight*this.dpr;
      this.w=canvas.width; this.h=canvas.height;
      this.ctx=canvas.getContext("2d");
      this.seed=Math.floor(rand(1e5,1e6));
      this.initParticles();
      canvas._scene = this; // 调试用：可在控制台检查每个 scene 的实例
      canvases.push(this);
      const onR=()=>{ canvas.width=canvas.offsetWidth*this.dpr; canvas.height=canvas.offsetHeight*this.dpr; this.w=canvas.width; this.h=canvas.height; };
      window.addEventListener("resize", onR);
      this.setActive(true); // 由页面引擎按当前页启停场景（彻底避免外屏后台问题的误判）
      // 名字是咒语：无论点到哪一屏，都会得到回应（星光+爱心+呼吸光圈）
      canvas.style.cursor="pointer";
      canvas.addEventListener("pointerdown",(e)=>{
        const r=canvas.getBoundingClientRect();
        this.tapBurst((e.clientX-r.left)*this.dpr,(e.clientY-r.top)*this.dpr);
      });
    }
    start(){ if(!this.run){ this.run=true; const loop=()=>{ if(!this.run) return; this.draw(this.t); this.t+=.016; this.raf=requestAnimationFrame(loop); }; this.raf=requestAnimationFrame(loop); } }
    stop(){ this.run=false; cancelAnimationFrame(this.raf); }
    setActive(a){ if(this.active===!!a) return; this.active=!!a; if(this.active) this.start(); else this.stop(); }
    initParticles(){
      const w=this.w,h=this.h;
      // 基础星尘（闪烁）
      this.stars=[]; const wn=Math.min(150,Math.floor(w*h/20000));
      for(let i=0;i<wn;i++) this.stars.push({x:rand(0,w),y:rand(0,h),r:rand(.4,1.5),ph:rand(0,TAU),sp:rand(.6,1.8)});
      // 亮星（带光晕 + 鼠标视差）
      this.bigStars=[]; const bn=Math.min(26,Math.floor(wn*.22));
      for(let i=0;i<bn;i++) this.bigStars.push({x:rand(0,w),y:rand(0,h*.92),r:rand(1.6,3.6),ph:rand(0,TAU),sp:rand(.7,1.6),z:rand(.4,1)});
      // 光尘 bokeh（漂浮荧光 + 视差）
      this.motes=[]; const mn=Math.min(72,Math.floor(w*h/24000));
      for(let i=0;i<mn;i++) this.motes.push({x:rand(0,w),y:rand(0,h),z:rand(.15,1),r:rand(.9,3)*this.dpr,ph:rand(0,TAU),vx:rand(-.1,.1),vy:rand(-.16,-.02),tone:Math.random()});
      // 发光花瓣（多色相 + 部分带辉光）
      this.petals=[]; const pn=Math.min(46,Math.floor(w/30));
      for(let i=0;i<pn;i++) this.petals.push({x:rand(0,w),y:rand(0,h),r:rand(3.5,8),vx:rand(-.26,.26),vy:rand(.5,1.25),ph:rand(0,TAU),sp:rand(.02,.05),rot:rand(0,TAU),rv:rand(-.04,.04),hue:[348,358,8,22,45][(Math.random()*5)|0],glow:Math.random()<.3});
      // 漂浮爱心
      const hn=(this.type==="cover"||this.type==="final"||this.type==="blossom"||this.type==="gate")?10:4;
      this.hearts=[]; for(let i=0;i<hn;i++) this.hearts.push({x:rand(0,w),y:rand(h*1.05,h+50),s:rand(4,9),vx:rand(-.3,.3),vy:rand(-.55,-.28),ph:rand(0,TAU),sp:rand(.02,.05),a:rand(.3,.6)});
      // 流星
      this.shooters=[];
      // 星云（缓慢呼吸的彩色光）
      this.nebulae=[]; const cols=[["255,158,196",.11],["150,178,255",.1],["255,208,150",.09]];
      for(let i=0;i<3;i++) this.nebulae.push({x:rand(.12,.88)*w,y:rand(.15,.82)*h,r:h*rand(.3,.5),col:cols[i%3][0],a0:cols[i%3][1],ph:rand(0,TAU),sp:rand(.3,.7)});
      // 点击/长按的回应粒子
      this.activeBursts=[];
      this.breaths=[];
      // 确定性静态剪影（一次性生成固定坐标，避免每帧随机 → 画面闪烁/抖动）
      const sd=this.seed;
      this.cityBuildings=[];
      let bx=-16;
      for(let b=0;b<11;b++){
        const bw=(26+((sd+b*7919)%29));
        const bh=h*(0.10+((sd+b*104729)%25)/100);
        const lx=bx, ly=h-bh;
        bx+=bw;
        const wins=[];
        const rows=Math.floor(bh/22);
        for(let n=0;n<rows;n++){
          const wx=lx+6+((sd+b*31+n)%Math.max(4,bw-12));
          if(((sd+b*13+n*7)%3)===0) wins.push({x:wx,y:ly+8+n*20});
        }
        this.cityBuildings.push({lx,ly,bw,bh,wins});
      }
      this.treeBlobs=[];
      for(let i=0;i<9;i++) this.treeBlobs.push({x:(30+((sd+i*31)%150)),y:h*.44+((sd+i*17)%90),r:(34+((sd+i*7)%26))});
    }
    /* ---- 发光层（additive 混合）：星云 + 流星 + 亮星 + 光尘 + 回应 ---- */
    drawGlowLayers(intensity=1){
      const c=this.ctx;
      c.save(); c.globalCompositeOperation="lighter";
      this.drawNebulas();
      this.drawShooters();
      this.paintBigStars();
      this.drawMotes(intensity);
      c.restore();
      this.drawBreaths();
      this.drawBursts();
    }
    drawNebulas(){
      const c=this.ctx,t=this.t;
      this.nebulae.forEach(n=>{
        const a=n.a0*(0.62+0.38*Math.sin(t*n.sp+n.ph));
        const gr=c.createRadialGradient(n.x,n.y,0,n.x,n.y,n.r);
        gr.addColorStop(0,"rgba("+n.col+","+a+")");
        gr.addColorStop(1,"rgba("+n.col+",0)");
        c.fillStyle=gr; c.fillRect(n.x-n.r,n.y-n.r,n.r*2,n.r*2);
      });
    }
    paintBigStars(){
      const c=this.ctx,t=this.t;
      this.bigStars.forEach(b=>{
        const tw=.5+.5*Math.sin(t*b.sp+b.ph);
        const px=b.x+pointer.x*b.z*16*this.dpr, py=b.y+pointer.y*b.z*16*this.dpr;
        const a=.6*tw;
        const gr=c.createRadialGradient(px,py,0,px,py,b.r*5);
        gr.addColorStop(0,"rgba(255,238,195,"+a+")");
        gr.addColorStop(.3,"rgba(255,238,195,"+(a*.3)+")");
        gr.addColorStop(1,"rgba(255,238,195,0)");
        c.fillStyle=gr; c.beginPath(); c.arc(px,py,b.r*5,0,TAU); c.fill();
      });
    }
    drawMotes(intensity){
      const c=this.ctx,w=this.w,h=this.h,t=this.t;
      this.motes.forEach(m=>{
        m.x+=m.vx; m.y+=m.vy; m.ph+=.012;
        if(m.y<-20){ m.y=h+20; m.x=rand(0,w); }
        if(m.x<-20)m.x=w+20; if(m.x>w+20)m.x=-20;
        const px=m.x+pointer.x*m.z*34*this.dpr, py=m.y+pointer.y*m.z*34*this.dpr;
        const tw=.5+.5*Math.sin(t*1.6+m.ph*3);
        const a=(.10+.30*tw)*m.z*intensity;
        const col = m.tone<.5? "255,214,170" : "255,176,205";
        const gr=c.createRadialGradient(px,py,0,px,py,m.r*3.4);
        gr.addColorStop(0,"rgba("+col+","+a+")");
        gr.addColorStop(1,"rgba("+col+",0)");
        c.fillStyle=gr; c.beginPath(); c.arc(px,py,m.r*3.4,0,TAU); c.fill();
      });
    }
    drawShooters(){
      const c=this.ctx,w=this.w,h=this.h;
      if((this.type==="starry"||this.type==="cover"||this.type==="gate")&&this.shooters.length<3) this.spawnShoot();
      else if(Math.random()<.008&&this.shooters.length<3) this.spawnShoot();
      this.shooters.forEach(s=>{
        s.x+=s.vx; s.y+=s.vy; s.life-=.016;
        const hx=s.x,hy=s.y,tx=s.x-s.vx*4.5,ty=s.y-s.vy*4.5;
        const gr=c.createLinearGradient(hx,hy,tx,ty);
        gr.addColorStop(0,"rgba(255,255,255,"+(.95*s.life)+")");
        gr.addColorStop(1,"rgba(255,255,255,0)");
        c.strokeStyle=gr; c.lineWidth=1.8*this.dpr*Math.max(.25,s.life);
        c.beginPath(); c.moveTo(hx,hy); c.lineTo(tx,ty); c.stroke();

        hg.addColorStop(0,"rgba(255,255,255,"+(.5*s.life)+")"); hg.addColorStop(1,"rgba(255,255,255,0)");
        c.fillStyle=hg; c.fillRect(hx-18*this.dpr,hy-18*this.dpr,36*this.dpr,36*this.dpr);
      });
      if(this.shooters.length) this.shooters=this.shooters.filter(s=>s.life>0);
    }
    spawnShoot(){
      const w=this.w,h=this.h;
      this.shooters.push({x:rand(w*.35,w*1.05),y:rand(0,h*.3),vx:-rand(5,9.5)*this.dpr,vy:rand(2,4.6)*this.dpr,life:1});
    }
    /* ---- 发光花瓣（多色 + 部分辉光） ---- */
    sprinkle(base=1){
      const c=this.ctx,w=this.w,h=this.h;
      this.petals.forEach(p=>{
        p.ph+=p.sp; p.x+=p.vx+Math.sin(p.ph)*.35; p.y+=p.vy; p.rot+=p.rv+Math.sin(p.ph)*.008;
        if(p.y>h+24){ p.y=-24; p.x=Math.random()*w; }
        if(p.x<-24)p.x=w+12; if(p.x>w+24)p.x=-12;
        c.save(); c.translate(p.x,p.y); c.rotate(p.rot);
        const a=(0.55+0.3*Math.sin(p.ph*2))*base;
        if(p.glow){ c.fillStyle="rgba(255,172,190,"+(a*.22)+")"; c.beginPath(); c.ellipse(0,0,p.r*2.6,p.r*1.5,0,0,TAU); c.fill(); }
        c.fillStyle="hsla("+p.hue+",86%,74%,"+a+")";
        c.beginPath(); c.ellipse(0,0,p.r,p.r*.56,0,0,TAU); c.fill();
        c.restore();
      });
    }
    /* ---- 漂浮升起的爱心 ---- */
    drawHearts(base=1){
      const c=this.ctx,w=this.w,h=this.h;
      this.hearts.forEach(p=>{
        p.ph+=p.sp; p.x+=p.vx+Math.sin(p.ph)*.4; p.y+=p.vy;
        if(p.y<-30){ p.y=h+30; p.x=rand(0,w); }
        drawHeart(c,p.x,p.y,p.s*this.dpr,"rgba(255,142,168,"+(p.a*(0.55+0.45*Math.sin(p.ph*2)))+")");
      });
    }
    /* ---- 名字是咒语：点一屏，给一点温柔的回应 ---- */
    tapBurst(x,y){
      const parts=[];
      for(let i=0;i<26;i++){
        const ang=rand(0,TAU), spd=rand(2.2,8)*this.dpr;
        parts.push({x:x,y:y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd-1*this.dpr,g:.18*this.dpr,life:1,kind:Math.random()<.45?"heart":"spark",sz:rand(3,6)*this.dpr});
      }
      this.activeBursts.push({parts});
      this.breaths.push({x:x,y:y,t:0});
    }
    drawBreaths(){
      const c=this.ctx;
      this.breaths.forEach(b=>{ b.t += 1/60; });
      this.breaths=this.breaths.filter(b=>b.t<1.2);
      this.breaths.forEach(b=>{
        const k=b.t/1.2;
        const r=(20+k*95)*this.dpr;
        c.save(); c.globalCompositeOperation="lighter";
        c.strokeStyle="rgba(243,201,139,"+((1-k)*.28)+")"; c.lineWidth=1.4*this.dpr*(1-k)+.3;
        c.beginPath(); c.arc(b.x,b.y,r,0,TAU); c.stroke();
        c.restore();
      });
    }
    drawBursts(){
      const c=this.ctx;
      this.activeBursts.forEach(b=>{
        let alive=false;
        b.parts.forEach(p=>{
          p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.life-=.018;
          if(p.life<=0) return; alive=true;
          if(p.kind==="heart"){
            drawHeart(c,p.x,p.y,p.sz*(.5+.5*p.life),"rgba(255,132,156,"+(p.life*.9)+")");
          } else {
            c.globalCompositeOperation="lighter";
            c.fillStyle="rgba(255,232,190,"+(p.life*.9)+")";
            c.beginPath(); c.arc(p.x,p.y,p.sz*.35,0,TAU); c.fill();
            c.globalCompositeOperation="source-over";
          }
        });
        b.alive=alive;
      });
      this.activeBursts=this.activeBursts.filter(b=>b.alive);
    }
    /* ---- 基础星尘 ---- */
    paintStars(base=1){
      const c=this.ctx,w=this.w,h=this.h,t=this.t;
      this.stars.forEach(s=>{
        const a=(.3+.6*Math.abs(Math.sin(s.ph+t*s.sp)))*base;
        c.fillStyle="rgba(255,235,200,"+a+")";
        c.beginPath(); c.arc(s.x,s.y,s.r,0,TAU); c.fill();
      });
    }
    draw(t){
      const c=this.ctx,w=this.w,h=this.h; c.clearRect(0,0,w,h);
      switch(this.type){
        case "gate":
        case "cover":
          g(c,w,h,["#070b22","#1a1033","#2a1a4a"]);
          this.drawGlowLayers(1.15);
          this.paintStars(1);
          this.sprinkle(1);
          this.drawHearts(.9);
          break;
        case "sunset":
          this.drawSunset(c,w,h,t);
          this.drawGlowLayers(.7);
          this.paintStars(.5);
          this.sprinkle(.9);
          this.drawHearts(.5);
          break;
        case "starry":
          this.drawStarry(c,w,h,t);
          this.drawGlowLayers(1.25);
          this.paintStars(1.1);
          this.sprinkle(.7);
          break;
        case "sea":
          this.drawSea(c,w,h,t);
          this.drawGlowLayers(.6);
          this.paintStars(.4);
          this.sprinkle(.5);
          break;
        case "city":
          this.drawCity(c,w,h,t);
          this.drawGlowLayers(1.1);
          this.paintStars(.3);
          this.sprinkle(.5);
          this.drawHearts(.4);
          break;
        case "blossom":
          this.drawBlossom(c,w,h,t);
          this.drawGlowLayers(.8);
          this.paintStars(.6);
          this.sprinkle(1);
          this.drawHearts(.85);
          break;
        case "letter":
          g(c,w,h,["#221a3c","#140f2e","#0b1026"]);
          this.drawGlowLayers(.5);
          this.paintStars(.55);
          break;
        case "unlock":
          g(c,w,h,["#1a1033","#100b26","#0b1026"]);
          this.drawGlowLayers(.95);
          this.paintStars(.8);
          this.sprinkle(.85);
          break;
        case "final":
          g(c,w,h,["#140b2e","#2a1a4a","#3d2440"]);
          this.drawGlowLayers(1.15);
          this.paintStars(1);
          this.sprinkle(1);
          this.drawHearts(.95);
          break;
      }
    }
    drawSunset(c,w,h,t){
      const gr=c.createLinearGradient(0,0,0,h);
      gr.addColorStop(0,"#231a46"); gr.addColorStop(.5,"#5b2a52"); gr.addColorStop(.8,"#c95b48"); gr.addColorStop(1,"#f2a25c");
      c.fillStyle=gr; c.fillRect(0,0,w,h);
      c.globalAlpha=.25; c.fillStyle="#ffdfae";
      for(let i=0;i<4;i++){ const y=h*.25+i*34, x=Math.sin(t*.1+i)*30; c.beginPath(); c.ellipse(w*(.3+i*.16)+x,y,w*.22,w*8,0,0,TAU); c.fill(); }
      c.globalAlpha=1;
      const sx=w*.5, sy=h*.86;
      const sg=c.createRadialGradient(sx,sy,0,sx,sy,h*.3);
      sg.addColorStop(0,"rgba(255,240,200,.95)"); sg.addColorStop(.3,"rgba(255,190,120,.4)"); sg.addColorStop(1,"rgba(255,190,120,0)");
      c.fillStyle=sg; c.fillRect(0,0,w,h);
      c.fillStyle="#fff3d6"; c.beginPath(); c.arc(sx,sy,Math.min(w,h)*.045,0,TAU); c.fill();
      c.strokeStyle="rgba(30,20,40,.7)"; c.lineWidth=2; c.globalAlpha=.8;
      for(let i=0;i<3;i++){ const b=w*(.25+i*.2)+Math.sin(t*.5+i)*20, by=h*.32-i*18;
        c.beginPath(); c.moveTo(b-10,by); c.quadraticCurveTo(b,by-8,b+10,by); c.quadraticCurveTo(b+20,by-8,b+30,by); c.stroke(); }
      c.globalAlpha=1;
    }
    drawStarry(c,w,h,t){
      g(c,w,h,["#070b22","#0d1130","#1a1033"]);
      c.save(); c.translate(w*.5,h*.5); c.rotate(.5);
      const gr=c.createLinearGradient(-w*.6,0,w*.6,0);
      gr.addColorStop(0,"rgba(0,0,0,0)");gr.addColorStop(.5,"rgba(200,180,255,.12)");gr.addColorStop(1,"rgba(0,0,0,0)");
      c.fillStyle=gr; c.fillRect(-w*.6,-h*.4,w*1.2,h*.8); c.restore();
    }
    drawSea(c,w,h,t){
      const gr=c.createLinearGradient(0,0,0,h);
      gr.addColorStop(0,"#0a1030"); gr.addColorStop(.55,"#12204d"); gr.addColorStop(.75,"#0d1a40"); gr.addColorStop(1,"#0a1230");
      c.fillStyle=gr; c.fillRect(0,0,w,h);
      const mx=w*.72, my=h*.3;
      const mg=c.createRadialGradient(mx,my,0,mx,my,w*.12);
      mg.addColorStop(0,"rgba(255,250,230,.95)"); mg.addColorStop(.4,"rgba(255,240,200,.25)"); mg.addColorStop(1,"rgba(0,0,0,0)");
      c.fillStyle=mg; c.fillRect(mx-w*.16,my-w*.16,w*.32,w*.32);
      c.fillStyle="#fff6dd"; c.beginPath(); c.arc(mx,my,Math.min(w,h)*.04,0,TAU); c.fill();
      const horizon=h*.62;
      const hg=c.createLinearGradient(0,horizon,0,h);
      hg.addColorStop(0,"#14365f"); hg.addColorStop(1,"#0a1a38");
      c.fillStyle=hg; c.fillRect(0,horizon,w,h-horizon);
      c.save(); c.beginPath(); c.rect(0,horizon,w,h-horizon); c.clip();
      for(let i=0;i<60;i++){
        const x=(i*173+((t*14)%40))%w, y=horizon+((i*97+Math.sin(t+i)*30)%(h-horizon));
        const len=8+30*Math.abs(Math.sin(i*3.7+t*2));
        const aSel=Math.max(.06,.45*(1-y/h));
        c.strokeStyle="rgba(255,235,190,"+aSel+")"; c.lineWidth=1.4;
        c.beginPath(); c.moveTo(x,y); c.lineTo(x+len*.6,y+len*.1); c.stroke();
      }
      c.restore();
    }
    drawCity(c,w,h,t){
      g(c,w,h,["#0a0d24","#151a3c","#0e1230"]);
      const glow=c.createRadialGradient(w*.5,h*.72,0,w*.5,h*.72,w*.8);
      glow.addColorStop(0,"rgba(255,150,120,.12)"); glow.addColorStop(1,"rgba(0,0,0,0)");
      c.fillStyle=glow; c.fillRect(0,0,w,h);
      // 楼群剪影（确定性坐标，每帧稳定不闪烁）
      this.cityBuildings.forEach(bd=>{
        c.fillStyle="rgba(8,12,30,.85)";
        c.fillRect(bd.lx,bd.ly,bd.bw,bd.bh+8);
        c.fillStyle="rgba(255,190,120,.8)";
        bd.wins.forEach(wn=>{ c.fillRect(wn.x,wn.y,4,6); });
      });
      for(let i=0;i<18;i++){
        const x=(i*331+((t*8)%w))%w, y=h*.86;
        const bgr=c.createRadialGradient(x,y,0,x,y,26);
        bgr.addColorStop(0,"rgba(255,210,150,.18)"); bgr.addColorStop(1,"rgba(0,0,0,0)");
        c.fillStyle=bgr; c.beginPath(); c.arc(x,y,26,0,TAU); c.fill();
      }
    }
    drawBlossom(c,w,h,t){
      const gr=c.createLinearGradient(0,0,0,h);
      gr.addColorStop(0,"#3a2850"); gr.addColorStop(.55,"#6b3a5c"); gr.addColorStop(.8,"#a05070"); gr.addColorStop(1,"#5b2a52");
      c.fillStyle=gr; c.fillRect(0,0,w,h);
      for(let i=0;i<18;i++){ const x=((i*257)%w), y=((i*181)%h);
        const bgr=c.createRadialGradient(x,y,0,x,y,80+((i*13)%60));
        bgr.addColorStop(0,"rgba(255,190,205,.10)"); bgr.addColorStop(1,"rgba(0,0,0,0)");
        c.fillStyle=bgr; c.beginPath(); c.arc(x,y,140,0,TAU); c.fill(); }
      c.fillStyle="rgba(20,12,26,.55)";
      c.fillRect(-10,h*.72,60,h);
      c.beginPath(); c.moveTo(30,h*.72); c.quadraticCurveTo(90,h*.45,150,h*.52); c.lineTo(170,h*.9); c.lineTo(30,h*.95); c.fill();
      this.treeBlobs.forEach(tb=>{
        const tgr=c.createRadialGradient(tb.x,tb.y,0,tb.x,tb.y,tb.r);
        tgr.addColorStop(0,"rgba(255,170,190,.28)");tgr.addColorStop(1,"rgba(0,0,0,0)");c.fillStyle=tgr;
        c.beginPath();c.arc(tb.x,tb.y,tb.r*1.8,0,TAU);c.fill(); });
    }
  }
  function g(c,w,h,stops){ const gr=c.createLinearGradient(0,0,0,h); stops.forEach((s,i)=>gr.addColorStop(i/(stops.length-1),s)); c.fillStyle=gr; c.fillRect(0,0,w,h); }

  document.querySelectorAll("canvas.scene-bg").forEach(cv=>new Scene(cv, cv.dataset.scene));

  /* ---------- 解锁：长按红心（封印解除） ---------- */
  const hold = {active:false, val:0};
  const ringBar=$("#ringBar"), clipRect=$("#clipRect"), stateEl=$("#unlockState");
  const C=2*Math.PI*57;
  ringBar.style.strokeDasharray=C; ringBar.style.strokeDashoffset=C;
  function setProgress(v){
    hold.val=v;
    ringBar.style.strokeDashoffset=C*(1-v);
    clipRect.setAttribute("y", 120*(1-v));
    stateEl.textContent = v<=0?"按住这里…":(v<1?Math.round(v*100)+"%" : "❤ 封印解除");
    if(v>=1) celebrate();
  }
  let holdTimer=null;
  function startHold(){
    if(hold.active||hold.val>=1) return; hold.active=true;
    const t0=performance.now(); const dur=DATA.unlock.holdSeconds*1000;
    if(reduce){ setProgress(1); return; }
    holdTimer=requestAnimationFrame(function f(now){
      if(!hold.active) return;
      const v=Math.min(1,(now-t0)/dur); setProgress(v);
      if(v<1) holdTimer=requestAnimationFrame(f);
    });
  }
  function endHold(){ hold.active=false; if(holdTimer) cancelAnimationFrame(holdTimer); }
  const hc=$("#heartCore");
  ["pointerdown"].forEach(e=>hc.addEventListener(e,startHold));
  ["pointerup","pointercancel","pointerleave"].forEach(e=>hc.addEventListener(e,endHold));
  setProgress(0);

  /* ---------- 庆祝：封印解除的满屏礼花 ---------- */
  let fxCanvas=null;
  function celebrate(){
    if(!fxCanvas){
      fxCanvas=document.createElement("canvas"); fxCanvas.style.cssText="position:fixed;inset:0;z-index:99;pointer-events:none;width:100%;height:100%;";
      document.body.appendChild(fxCanvas);
      fxCanvas.width=innerWidth*devicePixelRatio; fxCanvas.height=innerHeight*devicePixelRatio;
      addEventListener("resize",()=>{fxCanvas.width=innerWidth*devicePixelRatio;fxCanvas.height=innerHeight*devicePixelRatio;});
    }
    const c=fxCanvas.getContext("2d"); const W=fxCanvas.width,H=fxCanvas.height,d=devicePixelRatio; c.clearRect(0,0,W,H);
    const parts=[];
    for(let i=0;i<80;i++){
      const ang=rand(0,TAU), spd=rand(3,12)*d;
      parts.push({t:"heart",x:W*.5,y:H*.5,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd-d*rand(0,2.2),g:.2*d,r:rand(6,16)*d,ph:rand(0,TAU),life:1});
    }
    for(let i=0;i<120;i++){
      parts.push({t:"conf",x:rand(0,W),y:rand(-H*.5,0),vx:rand(-1,1)*d,vy:rand(2.4,5.6)*d,rot:rand(0,TAU),rv:rand(-.16,.16)*d,r:rand(4,8)*d,life:1,col:"hsla("+((Math.random()<.6?rand(38,52):rand(340,360))|0)+",90%,65%,"});
    }
    for(let i=0;i<60;i++){
      const ang=rand(0,TAU), spd=rand(4,13)*d;
      parts.push({t:"spark",x:W*.5,y:H*.5,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,g:.14*d,r:rand(1.4,4)*d,life:1});
    }
    const doneAt=2700, t0=performance.now();
    (function anim(now){
      c.clearRect(0,0,W,H);
      let alive=0;
      parts.forEach(p=>{
        if(p.t!=="conf") return;
        p.x+=p.vx; p.y+=p.vy; p.vy+=.03*d; p.rot+=p.rv; p.life-=.006;
        if(p.life>0&&p.y<H+40){
          alive++; c.save(); c.translate(p.x,p.y); c.rotate(p.rot);
          c.globalAlpha=Math.min(1,p.life*2);
          c.fillStyle=p.col+(Math.min(1,p.life*2)+")");
          c.fillRect(-p.r/2,-p.r/3,p.r,p.r*.62); c.restore();
        }
      });
      c.globalAlpha=1; c.globalCompositeOperation="lighter";
      parts.forEach(p=>{
        if(p.t==="conf") return;
        p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.ph+=.1; p.life-=.011;
        if(p.life<=0) return; alive++;
        if(p.t==="heart"){ drawHeart(c,p.x,p.y,p.r*(.5+.55*p.life),"rgba(255,132,158,"+(p.life*.92)+")"); }
        else { c.fillStyle="rgba(255,232,190,"+(p.life*.9)+")"; c.beginPath(); c.arc(p.x,p.y,p.r*.4,0,TAU); c.fill(); }
      });
      const wv=(now-t0)/doneAt;
      if(wv<=1){
        const R=(.15+wv*1.05)*Math.max(W,H)*.5;
        c.strokeStyle="rgba(255,240,205,"+((1-wv)*.85)+")"; c.lineWidth=Math.max(.5,2*d*(1-wv));
        c.beginPath(); c.arc(W*.5,H*.5,R,0,TAU); c.stroke();
      }
      c.globalCompositeOperation="source-over"; c.globalAlpha=1;
      if(now-t0<doneAt && alive>0) requestAnimationFrame(anim);
      else c.clearRect(0,0,W,H);
    })(t0);
  }
  function drawHeart(c,x,y,r,fill){
    c.save(); c.translate(x,y); c.scale(r/16,r/16); c.fillStyle=fill;
    c.beginPath();
    c.moveTo(0,6); c.bezierCurveTo(-9,-4,-14,-2,-7,6); c.bezierCurveTo(-3,11,0,14,0,14); c.bezierCurveTo(0,14,3,11,7,6); c.bezierCurveTo(14,-2,9,-4,0,6);
    c.fill(); c.restore();
  }

  /* ---------- 彩蛋：点署名发射纸鹤光 ---------- */
  $("#signature").addEventListener("click", celebrate);

  /* ---------- 重看：再倒放一遍 ---------- */
  $("#replayBtn").addEventListener("click", ()=>{ crossFade(0); });

  /* ---------- 页面引擎：按次翻页（空格/右键/滚动一格），约 2 秒渐变，切换期间输入锁定 ---------- */
  const pageEls=Array.prototype.slice.call(document.querySelectorAll("#cover, main .chapter, #letter, #unlock, #final"));
  const N=pageEls.length;
  document.body.style.height="100vh";
  document.body.style.overflow="hidden";
  const pageScenes=pageEls.map(el=>{ const cv=el.querySelector("canvas.scene-bg"); return cv&&cv._scene?cv._scene:null; });
  const dotLinks=Array.prototype.slice.call($("#dots").children||[]);
  const easeInOut=t=> t<.5?4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
  function zoneFor(id){
    if(id==="letter"||id==="unlock"||id==="final"||id==="ch-05") return "soft";
    if(id==="ch-03"||id==="ch-04") return "move";
    return "now";
  }
  function paint(i){
    pageEls.forEach((el,k)=>{
      const on=(k===i);
      el.style.opacity=on?1:0;
      el.style.visibility=on?"visible":"hidden";
      el.style.pointerEvents=on?"auto":"none";
      el.style.zIndex=on?10:1;
    });
    pageScenes.forEach((s,k)=>{ if(s) s.setActive(k===i); });
    dotLinks.forEach((a,k)=>a.classList.toggle("on", k===i));
    setZone(zoneFor(pageEls[i].id));
    if(pageEls[i].id==="letter") typeLetter();
    if(pageEls[i].id==="final") startCrane();
    window.__page={i,cur,N};
  }
  /* 2 秒渐变：当前页淡出、下一页淡入；期间所有输入锁定（busy） */
  function crossFade(to){
    if(busy || to<0 || to>=N || to===cur) return;
    busy=true;
    const from=cur;
    pageEls[from].style.zIndex=11;          // 先出页在上，淡出以露出下一页
    pageEls[to].style.zIndex=10;
    pageEls[to].style.visibility="visible";
    pageEls[to].style.pointerEvents="auto";
    pageEls[from].style.pointerEvents="none";
    pageScenes[from]&&pageScenes[from].setActive(true);
    pageScenes[to]&&pageScenes[to].setActive(true);
    dotLinks.forEach((a,k)=>a.classList.toggle("on", k===to));
    const t0=performance.now(), D=2100;
    (function step(now){
      const k=Math.min(1,(now-t0)/D);
      const e=easeInOut(k);
      pageEls[from].style.opacity=1-e;
      pageEls[to].style.opacity=e;
      if(k<1){ requestAnimationFrame(step); }
      else {
        pageEls[from].style.opacity=0; pageEls[from].style.visibility="hidden"; pageEls[from].style.zIndex=1; pageEls[from].style.pointerEvents="none";
        pageEls[to].style.opacity=1; pageEls[to].style.zIndex=10; pageEls[to].style.pointerEvents="auto";
        busy=false; cur=to;
        pageScenes.forEach((s,k2)=>{ if(s) s.setActive(k2===cur); });
        setZone(zoneFor(pageEls[cur].id));
        if(pageEls[cur].id==="letter") typeLetter();
        if(pageEls[cur].id==="final") startCrane();
        window.__page={i:cur,cur,N};
      }
    })(t0);
  }
  function go(dir){ if(!opened||busy) return; crossFade(cur+dir); }
  opened = !(DATA.gate.ask && !DATA.toName);   // 没设「门口提问」→ 一进来就能翻页

  /* —— 触发：空格 / 右键 / 滚动一格（2 秒渐变中一律忽略） —— */
  let wheelLock=0;
  document.addEventListener("keydown",(e)=>{
    if(!opened||busy) return;
    if(e.code==="Space"){ e.preventDefault(); if(e.repeat) return; go(1); }
    else if(e.code==="ArrowRight"||e.code==="ArrowDown"||e.code==="PageDown"||e.code==="Enter"){ if(e.repeat) return; go(1); }
    else if(e.code==="ArrowLeft"||e.code==="ArrowUp"||e.code==="PageUp"){ if(e.repeat) return; go(-1); }
  });
  document.addEventListener("contextmenu",(e)=>{ if(!opened||busy) return; e.preventDefault(); go(1); });
  window.addEventListener("wheel",(e)=>{
    if(!opened||busy) return;
    e.preventDefault();
    const now=Date.now();
    if(now<wheelLock) return;           // 一次物理滚动只翻一页
    wheelLock=now+700;
    go(e.deltaY>0?1:-1);
  },{passive:false});
  let tx=0, ty=0, tt=0;
  document.addEventListener("touchstart",(e)=>{ if(!opened||busy) return; const t=e.changedTouches[0]; tx=t.clientX; ty=t.clientY; tt=Date.now(); },{passive:true});
  document.addEventListener("touchend",(e)=>{
    if(!opened||busy) return;
    const t=e.changedTouches[0];
    const dx=t.clientX-tx, dy=t.clientY-ty, dt=Date.now()-tt;
    if(dt>700) return;
    if(Math.abs(dx)>50 || Math.abs(dy)>60){
      go(Math.abs(dx)>Math.abs(dy) ? (dx<0?1:-1) : (dy<0?1:-1));
    }
  },{passive:true});
  window.addEventListener("resize", ()=>paint(cur));
  paint(cur);

  /* ---------- 调试钩子（可删除） ---------- */
  window.__t = { typeLetter: typeLetter, startHold: startHold, endHold: endHold, setProgress: setProgress, celebrate: celebrate, startCrane: startCrane, unlockTheLetter: unlockTheLetter };
})();
</script>
