<!doctype html>
<!--
  ASSUMPTIONS / DEMO NOTES
  1. 人名、日期和故事均为虚构占位，正式版应替换为用户真实内容。
  2. 体验优先为手机设计；桌面用横向电影构图展开。
  3. 主线是连续雨夜步行，三件旧物只是沿途停顿；未发送消息只出现在结尾。
  4. 不依赖服务器或第三方库，双击本文件即可运行。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="./final-demo/"><title>走回去｜融合方向 Demo</title>
<link rel="preload" as="image" href="../assets/route-selected/01-subway.png"><link rel="preload" as="image" href="../assets/route-selected/02-store.png"><link rel="preload" as="image" href="../assets/route-selected/03-corner.png"><link rel="preload" as="image" href="../assets/route-selected/04-home.png">
<style>
:root{--warm:#efc27b;--paper:#eee2c8;--ink:#251c14;--mist:#dce5e6;--night:#061015;--red:#a44335}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--night);color:#fff;font-family:"PingFang SC","Microsoft YaHei",sans-serif}button{font:inherit}.app{position:relative;height:100svh;isolation:isolate;overflow:hidden}.bg{position:absolute;z-index:-5;inset:-6%;background:url('../assets/rain-walk.png') 50% 50%/cover no-repeat;transform:scale(1.05);transition:transform 1.45s cubic-bezier(.2,.75,.12,1),filter 1s}.shade{position:absolute;z-index:-4;inset:0;background:linear-gradient(90deg,rgba(2,8,11,.82),rgba(2,8,11,.22) 54%,rgba(2,8,11,.32)),linear-gradient(0deg,rgba(1,5,7,.76),transparent 55%)}.grain{position:absolute;z-index:10;inset:0;pointer-events:none;opacity:.075;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence baseFrequency='.8' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}.rain{position:absolute;z-index:1;inset:-100px;pointer-events:none;opacity:.18;background:repeating-linear-gradient(104deg,transparent 0 18px,rgba(220,238,240,.36) 19px,transparent 20px 42px);animation:rain .62s linear infinite}
.hud{position:absolute;z-index:4;left:clamp(22px,4vw,62px);right:clamp(22px,4vw,62px);top:clamp(20px,4vh,42px);display:flex;justify-content:space-between;align-items:center}.route{font:600 11px/1.5 ui-monospace,monospace;letter-spacing:.17em;color:var(--mist)}.sound{border:0;background:none;color:#ccd8da;cursor:pointer;font:11px/1 ui-monospace,monospace;letter-spacing:.12em;padding:12px}.bars{display:inline-flex;gap:3px;align-items:end;height:12px;margin-left:10px}.bars i{width:1px;background:currentColor;animation:bar .8s ease-in-out infinite alternate}.bars i:nth-child(1){height:5px}.bars i:nth-child(2){height:11px;animation-delay:.2s}.bars i:nth-child(3){height:7px;animation-delay:.4s}.sound.off{opacity:.55}.sound.off .bars i{animation:none;height:2px}
.intro{position:absolute;z-index:8;inset:0;display:grid;align-content:end;padding:clamp(28px,7vw,108px);padding-bottom:clamp(54px,11vh,105px);background:linear-gradient(90deg,rgba(2,8,11,.82),rgba(2,8,11,.1));transition:opacity .8s,visibility .8s}.intro.hidden{opacity:0;visibility:hidden;pointer-events:none}.kicker{font:600 11px/1 ui-monospace,monospace;letter-spacing:.19em;color:var(--warm);margin-bottom:22px}.intro h1,.story h2{font-family:"Noto Serif SC","Songti SC",serif;font-weight:400;letter-spacing:.02em;text-wrap:pretty}.intro h1{font-size:clamp(52px,8vw,112px);line-height:.98;margin:0;max-width:820px;text-shadow:0 4px 30px #000}.intro p{font:clamp(15px,1.4vw,19px)/1.8 serif;max-width:550px;color:#edf0ec;margin:26px 0 33px}.start,.walk,.paper-next,.send{min-height:54px;border:1px solid rgba(255,255,255,.72);background:rgba(4,12,15,.4);color:#fff;padding:0 25px;cursor:pointer;letter-spacing:.08em}.start{width:max-content}.start:hover,.walk:hover{background:var(--warm);border-color:var(--warm);color:#181107}
.story{position:absolute;z-index:3;left:clamp(22px,7vw,108px);bottom:clamp(132px,19vh,185px);max-width:650px;opacity:0;transform:translateY(14px);transition:.65s}.story.visible{opacity:1;transform:none}.place{font:600 11px/1 ui-monospace,monospace;letter-spacing:.18em;color:var(--warm);margin-bottom:20px}.story h2{font-size:clamp(43px,6vw,82px);line-height:1.06;margin:0;text-shadow:0 4px 26px #000}.story p{font:clamp(15px,1.4vw,19px)/1.85 serif;max-width:530px;color:#eff3ef;text-shadow:0 2px 14px #000;margin:22px 0 0}.story.change>*{animation:rise .7s ease both}.story.change p{animation-delay:.08s}
.artifact{position:absolute;z-index:5;right:clamp(28px,9vw,148px);top:46%;width:104px;height:104px;border:0;background:transparent;color:#fff;cursor:pointer;opacity:0;transform:scale(.65) rotate(-10deg);pointer-events:none;transition:.65s cubic-bezier(.2,.8,.2,1)}.artifact.show{opacity:1;transform:scale(1) rotate(0);pointer-events:auto}.artifact::before{content:"";position:absolute;inset:13px;border:1px solid var(--warm);border-radius:50%;box-shadow:0 0 0 12px rgba(239,194,123,.08),0 0 30px rgba(239,194,123,.2)}.artifact::after{content:attr(data-label);position:absolute;top:100%;left:50%;transform:translateX(-50%);white-space:nowrap;font:12px/1.4 serif;color:#ffe1ae;text-shadow:0 2px 12px #000}.artifact:hover::before{background:rgba(239,194,123,.22);transform:scale(1.12)}
.controls{position:absolute;z-index:4;left:clamp(22px,4vw,62px);right:clamp(22px,4vw,62px);bottom:clamp(22px,4vh,42px);display:grid;grid-template-columns:auto 1fr auto;gap:26px;align-items:center;opacity:0;transform:translateY(12px);transition:.5s}.controls.on{opacity:1;transform:none}.steps{font:11px/1 ui-monospace,monospace;color:var(--mist);min-width:80px}.track{height:1px;background:rgba(255,255,255,.27);position:relative}.progress{height:1px;width:0;background:var(--warm);transition:width 1s}.progress::after{content:"";position:absolute;top:-4px;left:var(--x,0%);width:9px;height:9px;border-radius:50%;background:var(--warm);box-shadow:0 0 16px var(--warm);transition:left 1s;transform:translateX(-4px)}.walk:disabled{opacity:.35;cursor:not-allowed}.walk:disabled:hover{background:rgba(4,12,15,.4);color:#fff;border-color:rgba(255,255,255,.72)}
.paper-wrap{position:absolute;z-index:9;inset:0;background:rgba(2,7,9,.52);opacity:0;visibility:hidden;transition:.45s}.paper-wrap.open{opacity:1;visibility:visible}.paper{position:absolute;right:clamp(16px,5vw,70px);top:50%;width:min(470px,calc(100vw - 32px));min-height:590px;padding:34px 42px;color:var(--ink);background:linear-gradient(110deg,rgba(100,70,38,.07),transparent 45%),var(--paper);box-shadow:-26px 35px 90px rgba(0,0,0,.58);transform:translate(125%,-50%) rotate(2deg);transition:.65s cubic-bezier(.2,.8,.2,1)}.open .paper{transform:translate(0,-50%) rotate(-.7deg)}.paper::before{content:"";position:absolute;inset:9px;border:1px solid rgba(76,49,29,.24)}.paper-top{display:flex;justify-content:space-between;position:relative;font:11px/1 ui-monospace,monospace;letter-spacing:.14em;color:#816548}.close{border:0;background:none;font:26px/1 sans-serif;color:#604932;cursor:pointer}.object-shot{height:170px;margin:32px 0 27px;background:url('../assets/desk-evidence.png') center/cover no-repeat;filter:sepia(.16) contrast(.92);border:1px solid rgba(60,38,21,.2)}.paper[data-item="ticket"] .object-shot{background-position:45% 43%;background-size:220%}.paper[data-item="receipt"] .object-shot{background-position:27% 28%;background-size:210%}.paper[data-item="note"] .object-shot{background-position:46% 63%;background-size:210%}.paper h3{font:400 31px/1.25 "Noto Serif SC","Songti SC",serif;margin:0 0 17px}.paper-copy{font:16px/1.85 serif;margin:0}.paper-note{font:italic 15px/1.7 serif;color:#725740;margin:20px 0 0}.paper-next{position:absolute;left:42px;bottom:34px;background:var(--ink);border-color:var(--ink);min-height:48px}.paper-date{position:absolute;right:42px;bottom:49px;font:11px/1 ui-monospace,monospace;color:#826649}
.ending{position:absolute;z-index:8;inset:0;display:grid;grid-template-columns:1fr minmax(360px,42vw);background:rgba(2,7,9,.32);opacity:0;visibility:hidden;transition:.8s}.ending.show{opacity:1;visibility:visible}.window-copy{align-self:center;padding:clamp(28px,7vw,105px)}.window-copy .small{font:11px/1 ui-monospace,monospace;letter-spacing:.18em;color:var(--warm)}.window-copy h2{font:400 clamp(48px,7vw,96px)/1.04 "Noto Serif SC","Songti SC",serif;margin:22px 0}.window-copy p{font:17px/1.8 serif;max-width:450px}.draft-panel{background:#f2f1ed;color:#121211;padding:clamp(30px,5vw,68px);display:grid;grid-template-rows:auto 1fr auto;border-left:1px solid #111}.draft-head{display:flex;justify-content:space-between;font:11px/1 ui-monospace,monospace;letter-spacing:.1em}.draft-main{align-self:center}.draft-main label{font:11px/1 ui-monospace,monospace;color:#8b3e31;letter-spacing:.14em}.typed{font:400 clamp(24px,3vw,44px)/1.5 "Noto Serif SC","Songti SC",serif;margin:28px 0;min-height:150px;border-top:1px solid #111;padding-top:25px}.cursor{display:inline-block;width:2px;height:1em;background:#111;vertical-align:-2px;animation:blink .85s steps(1) infinite}.send{background:#111;color:#fff;border-color:#111;width:100%}.sent-line{font:12px/1 ui-monospace,monospace;color:#23634d;opacity:0;margin-top:14px}.sent-line.show{opacity:1}.send:disabled{background:#23634d;border-color:#23634d}.end-note{align-self:end;font:14px/1.6 serif;color:#575752}
@keyframes rain{to{transform:translate(-18px,38px)}}@keyframes bar{to{height:3px}}@keyframes rise{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}@keyframes blink{50%{opacity:0}}
@media(max-width:720px){.bg{background-position:58% center}.shade{background:linear-gradient(0deg,rgba(1,5,7,.88),transparent 78%)}.route{max-width:250px}.story{left:22px;right:22px;bottom:145px}.story h2{font-size:46px}.story p{font-size:15px;line-height:1.7}.artifact{right:22px;top:38%;width:88px;height:88px}.controls{grid-template-columns:1fr auto;gap:14px}.track{grid-column:1/-1;grid-row:1}.steps{grid-row:2}.walk{grid-row:2;min-width:155px;padding:0 17px}.paper{top:auto;right:8px;left:8px;bottom:0;width:auto;min-height:72svh;padding:27px 28px;transform:translateY(110%)}.open .paper{transform:translateY(0) rotate(-.4deg)}.object-shot{height:135px;margin:21px 0}.paper h3{font-size:27px}.paper-copy{font-size:15px}.paper-next{left:28px;bottom:25px}.paper-date{right:28px;bottom:40px}.ending{grid-template-columns:1fr;align-content:end;background:linear-gradient(0deg,rgba(2,7,9,.94),rgba(2,7,9,.22))}.window-copy{padding:22px 22px 16px;align-self:end}.window-copy h2{font-size:45px;margin:13px 0}.window-copy p{font-size:14px;margin:0}.draft-panel{min-height:47svh;padding:26px 22px;border-left:0;border-top:1px solid #111}.typed{font-size:25px;min-height:100px;margin:20px 0;padding-top:18px}.end-note{display:none}.intro{padding:25px 22px 58px}.intro h1{font-size:58px}.intro p{font-size:15px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
<style>
.paper[data-item="ticket"] .object-shot{background-position:46% 42%;background-size:390%}
.paper[data-item="receipt"] .object-shot{background-position:27% 28%;background-size:380%}
.paper[data-item="note"] .object-shot{background-position:47% 66%;background-size:380%}
.bg{opacity:0;transition:opacity 1.05s ease,transform 1.45s cubic-bezier(.2,.75,.12,1),filter 1s}
.bg.active{opacity:1}

<body><main class="app">
  <div class="bg active" id="bg0" style="background-image:url('../assets/rain-walk.png')"></div><div class="bg" id="bg1"></div><div class="shade"></div><div class="rain"></div><div class="grain"></div>
  <div class="hud"><div class="route">ROUTE 04 · 从地铁口到那扇亮着的窗</div><button class="sound off" id="sound" aria-label="切换雨声">雨声 <span class="bars"><i></i><i></i><i></i></span></button></div>
  <section class="intro" id="intro"><div class="kicker">A WALK IN THE RAIN · 00:47</div><h1>陪你走回家的<br>那条路</h1><p>只有九百二十步。路上有三件被留下来的东西，还有一句一直没有发出去的话。</p><button class="start" id="start">和我走一段 →</button></section>
  <section class="story" id="story"><div class="place" id="place"></div><h2 id="sceneTitle"></h2><p id="sceneCopy"></p></section>
  <button class="artifact" id="artifact" data-label="捡起这件东西" aria-label="打开沿途旧物"></button>
  <div class="controls" id="controls"><div class="steps" id="steps">0000 / 0920</div><div class="track"><div class="progress" id="progress"></div></div><button class="walk" id="walk">往前走一步 →</button></div>
  <div class="paper-wrap" id="paperWrap"><article class="paper" id="paper"><div class="paper-top"><span id="paperIndex"></span><button class="close" id="close" aria-label="合上">×</button></div><div class="object-shot"></div><h3 id="paperTitle"></h3><p class="paper-copy" id="paperCopy"></p><p class="paper-note" id="paperNote"></p><button class="paper-next" id="paperNext">收好，继续走</button><span class="paper-date" id="paperDate"></span></article></div>
  <section class="ending" id="ending"><div class="window-copy"><div class="small">0920 STEPS · HOME</div><h2>那扇窗<br>还亮着</h2><p>走到这里，路已经结束了。但我还有一句话，想让它不再只是草稿。</p></div><div class="draft-panel"><div class="draft-head"><span>DRAFT / 01:03</span><span>未发送</span></div><div class="draft-main"><label>修改了 3 次</label><div class="typed" id="typed"><span class="cursor"></span></div><button class="send" id="send">把这句话留下</button><div class="sent-line" id="sentLine">已送达 · 01:03</div></div><div class="end-note">不是只走这一条路。是每一个很普通、也可能下雨的晚上。</div></div></section>
</main>
<script>
const scenes=[
 {image:'../assets/route-selected/01-subway.png',place:'01 · 180 STEPS / 地铁口',title:'你替我收好了<br>那副耳机',copy:'车门快开时，我还在打瞌睡。你没有催，只把耳机线绕好，轻轻碰了碰我的手背。',steps:'0180 / 0920',item:{key:'ticket',label:'捡起那张地铁票',index:'EVIDENCE 01 · METRO TICKET',title:'一张没有舍得扔的地铁票',copy:'那天的车票后来一直夹在手机壳里。不是因为它有什么用，只是每次看见，都能想起有人在到站前替我收好耳机。',note:'喜欢有时候，就是把人照顾得不露痕迹。',date:'05 / 02'}},
 {image:'../assets/route-selected/02-store.png',place:'02 · 420 STEPS / 便利店',title:'你还是多拿了<br>一瓶水',copy:'我说不渴，你没反驳。走到一半，我果然从你手里抢过去喝了两口。',steps:'0420 / 0920',item:{key:'receipt',label:'捡起水边的小票',index:'EVIDENCE 02 · RECEIPT',title:'买了两瓶水的小票',copy:'小票上没有什么特别的东西：两瓶水，一包纸巾。可我后来才明白，你记住我的习惯，总比我自己更早一点。',note:'普通日子被记住以后，就有了重量。',date:'06 / 18'}},
 {image:'../assets/route-selected/03-corner.png',place:'03 · 680 STEPS / 雨中转角',title:'雨忽然<br>下大了一点',copy:'伞明明在我们中间，你那边却一点都没湿。我当时没有拆穿你。',steps:'0680 / 0920',item:{key:'note',label:'捡起湿掉的便签',index:'EVIDENCE 03 · FOLDED NOTE',title:'湿掉一角的便签',copy:'回去以后，我在口袋里摸到这张便签。原本只写着“记得带伞”，下面又多了一行很小的字：别再把右边肩膀淋湿了。',note:'原来你也早就发现了。',date:'07 / 09'}},
 {image:'../assets/route-selected/04-home.png',place:'04 · 920 STEPS / 楼下',title:'我们把一句晚安<br>说得很慢',copy:'谁都没有立刻转身。好像只要再站一会儿，今天就不会结束。',steps:'0920 / 0920',item:null}
];
let stage=-1,itemRead=false,audioCtx=null,rainNode=null,bgSlot=0;const $=s=>document.querySelector(s),bgLayers=[$('#bg0'),$('#bg1')],story=$('#story'),walk=$('#walk'),artifact=$('#artifact'),paperWrap=$('#paperWrap');
function setBackground(src,zoom){const next=1-bgSlot,el=bgLayers[next];el.style.backgroundImage=`url('${src}')`;el.style.transform=`scale(${zoom})`;el.classList.add('active');bgLayers[bgSlot].classList.remove('active');bgSlot=next}
function setScene(i){stage=i;itemRead=!scenes[i].item;const x=scenes[i];story.classList.remove('change');void story.offsetWidth;$('#place').textContent=x.place;$('#sceneTitle').innerHTML=x.title;$('#sceneCopy').textContent=x.copy;$('#steps').textContent=x.steps;$('#progress').style.width=((i+1)/4*100)+'%';$('#progress').style.setProperty('--x',((i+1)/4*100)+'%');setBackground(x.image,1.07+(i+1)*.018);story.classList.add('visible','change');artifact.classList.toggle('show',!!x.item);walk.disabled=!!x.item;walk.textContent=x.item?'先捡起路边的东西':(i===3?'走到那扇窗前 →':'往前走一步 →');if(x.item)artifact.dataset.label=x.item.label}
function openItem(){const x=scenes[stage].item;if(!x)return;$('#paper').dataset.item=x.key;$('#paperIndex').textContent=x.index;$('#paperTitle').textContent=x.title;$('#paperCopy').textContent=x.copy;$('#paperNote').textContent=x.note;$('#paperDate').textContent=x.date;paperWrap.classList.add('open')}
function closeItem(){paperWrap.classList.remove('open');itemRead=true;artifact.classList.remove('show');walk.disabled=false;walk.textContent=stage===3?'走到那扇窗前 →':'收好了，继续走 →'}
function typeFinal(){const text='以后下雨、坐地铁、买水，也都继续一起吧。';let i=0;const timer=setInterval(()=>{$('#typed').innerHTML=text.slice(0,++i)+'<span class="cursor"></span>';if(i>=text.length)clearInterval(timer)},70)}
$('#start').addEventListener('click',()=>{$('#intro').classList.add('hidden');$('#controls').classList.add('on');setScene(0);toggleRain(true)});
walk.addEventListener('click',()=>{if(!itemRead)return;if(stage<3)setScene(stage+1);else{$('#controls').classList.remove('on');story.classList.remove('visible');artifact.classList.remove('show');$('#ending').classList.add('show');bgLayers[bgSlot].style.transform='scale(1.18) translate(-1.2%,.4%)';setTimeout(typeFinal,600)}});
artifact.addEventListener('click',openItem);$('#close').addEventListener('click',closeItem);$('#paperNext').addEventListener('click',closeItem);
$('#send').addEventListener('click',e=>{e.currentTarget.textContent='已经留下了';e.currentTarget.disabled=true;$('#sentLine').classList.add('show');document.querySelector('.draft-head span:last-child').textContent='已发送'});
function toggleRain(force){if(force===true&&audioCtx)return;if(audioCtx){audioCtx.close();audioCtx=null;rainNode=null;$('#sound').classList.add('off');return}audioCtx=new(window.AudioContext||window.webkitAudioContext)();const seconds=2,buffer=audioCtx.createBuffer(1,audioCtx.sampleRate*seconds,audioCtx.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;const src=audioCtx.createBufferSource(),filter=audioCtx.createBiquadFilter(),gain=audioCtx.createGain();src.buffer=buffer;src.loop=true;filter.type='lowpass';filter.frequency.value=1150;gain.gain.value=.045;src.connect(filter).connect(gain).connect(audioCtx.destination);src.start();rainNode=src;$('#sound').classList.remove('off')}
$('#sound').addEventListener('click',()=>toggleRain(false));addEventListener('keydown',e=>{if(e.key==='Escape'&&paperWrap.classList.contains('open'))closeItem();if(e.key==='ArrowRight'&&!walk.disabled&&stage>=0)walk.click()});
window.__ready=true;
</script></body></html>
